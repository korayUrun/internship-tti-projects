# Panel'i servis eden nginx — KÖK OLMAYAN kullanıcıyla (1000:1000) çalışır.
#
# ⚠️ Bu dosya /etc/nginx/nginx.conf'un TAMAMINI değiştirir, conf.d parçası DEĞİLDİR: kök
# olmayan çalıştırmanın gerektirdiği üç ayar da (pid yolu, geçici yollar, ayrıcalıksız port)
# ana bağlam yönergesidir ve bir conf.d parçasından verilemez.

worker_processes auto;

# /var/run kök dışına yazılabilir değil.
pid /tmp/nginx.pid;

error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /dev/stdout;

    # Geçici yollar /tmp'ye alınır: 1000 kullanıcısı /var/cache/nginx'e yazamaz ve nginx
    # ilk büyük istekte 500 döner.
    client_body_temp_path /tmp/nginx-client;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;

    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    server {
        # 80 ayrıcalıklı bir porttur, kök olmayan kullanıcı bağlayamaz. Caddy zaten bu
        # konteynere compose ağı üzerinden SERVİS ADIYLA ulaşıyor, port serbestçe seçilebilir.
        listen 8080;
        server_name _;

        root  /usr/share/nginx/html;
        index index.html;

        # --- Backend yolları -------------------------------------------------------------
        # ÜRETİMDE bu bloklara istek GELMEZ: Caddy `data.<DOMAIN>` altında /api, /admin, /docs,
        # /openapi.json, /static ve /health yollarını zaten doğrudan backend'e yönlendiriyor.
        # Buradaki vekil, panel konteynerini KENDİ BAŞINA doğru kılıyor — Caddy'siz geliştirme
        # yığınında (deploy/docker-compose.yml) panel bu bloklar olmadan /api'ye SPA'nın
        # index.html'ini döndürürdü ve hata "JSON bekleniyordu" diye yanlış yerde görünürdü.
        #
        # ⚠️ `resolver` + değişken KASITLI: proxy_pass'a düz bir konteyner adı yazılırsa nginx
        # adı AÇILIŞTA çözmeye çalışır ve backend o an ayakta değilse başlamayı reddeder —
        # `restart: unless-stopped` bunu sonsuz çökme döngüsüne çevirir. Değişken kullanınca
        # çözümleme istek anına ertelenir. 127.0.0.11 Docker'ın gömülü DNS'idir.
        resolver 127.0.0.11 valid=30s ipv6=off;

        location ~ ^/(api|admin|docs|openapi\.json|static|health) {
            set $arka_uc http://tti-data-server:8000;
            proxy_pass $arka_uc$request_uri;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Excel yüklemeleri büyük olabilir; nginx'in 1 MB'lık varsayılanı sessizce 413 döner.
            client_max_body_size 64m;
            proxy_read_timeout 300s;
        }

        # SPA geri düşüşü: /login, /datasets/... gibi istemci yolları doğrudan yenilendiğinde
        # de index.html dönmeli, yoksa tarayıcı 404 alır.
        location / {
            try_files $uri $uri/ /index.html;
        }

        # index.html ASLA cache'lenmemeli: yeni bir SURUM yayınlandığında hash'li asset adları
        # değişir; cache'lenmiş eski index.html artık var olmayan dosyaları ister ve kullanıcı
        # beyaz ekran görür.
        location = /index.html {
            add_header Cache-Control "no-store, must-revalidate";
        }

        # Hash'li asset'ler ise sonsuza kadar cache'lenebilir (adları içeriğe bağlı).
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }
}
