[versions]
agp = "8.13.2"
kotlin = "2.3.21"
ktlint-plugin = "13.1.0"

compileSdk = "36"
minSdk = "26"
targetSdk = "36"

core-ktx = "1.17.0"
lifecycle = "2.9.4"
activity-compose = "1.12.4"
compose-bom = "2026.06.01"
navigation-compose = "2.9.8"
kotlinx-serialization = "1.9.0"
kotlinx-coroutines = "1.11.0"
datastore = "1.2.1"
desugar = "2.1.5"
# Mobil HTTP istemcisi (yalnızca :app, Faz J). Retrofit eklenmedi: bir düzine uç için arayüz üretimi
# ve ikinci bir dönüştürücü katmanı gereksiz. OkHttp'nin kendisi çerez saklama, multipart ve zaman
# aşımı sağlıyor; APK'ya etkisi ~800 KB (okio dahil).
okhttp = "5.2.1"

fastexcel = "0.20.2"
poi = "5.4.1"
# PDF üretimi (yalnızca :server). LGPL 2.1 — iText 5/7 AGPL olduğu için kullanılamaz (CLAUDE.md §6).
# 1.1.x sürümleri `io.github.openhtmltopdf` grubunda; eski `com.openhtmltopdf` grubu 1.0.10'da durdu.
openhtmltopdf = "1.1.65"

# Sunucu (:server) — Spring Boot 4.1 taban Java sürümü 17, mevcut toolchain ile uyumlu.
# Flyway ve PostgreSQL sürücüsünün sürümleri Spring Boot BOM'u tarafından yönetilir.
spring-boot = "4.1.0"
# :tools:kable-import Spring BOM'u kullanmadığı için sürücü sürümü açıkça belirtilir.
postgresql = "42.7.13"

junit = "4.13.2"
truth = "1.4.4"
androidx-test-junit = "1.3.0"
androidx-test-runner = "1.7.0"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation-compose" }

compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }

okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }

kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }
desugar-jdk-libs = { module = "com.android.tools:desugar_jdk_libs", version.ref = "desugar" }

fastexcel = { module = "org.dhatim:fastexcel", version.ref = "fastexcel" }
poi-ooxml = { module = "org.apache.poi:poi-ooxml", version.ref = "poi" }
openhtmltopdf-core = { module = "io.github.openhtmltopdf:openhtmltopdf-core", version.ref = "openhtmltopdf" }
openhtmltopdf-pdfbox = { module = "io.github.openhtmltopdf:openhtmltopdf-pdfbox", version.ref = "openhtmltopdf" }

spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-jdbc = { module = "org.springframework.boot:spring-boot-starter-jdbc" }
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-security-test = { module = "org.springframework.security:spring-security-test" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
# Spring Boot 4 otokonfigürasyonları ayrı modüllere böldü: flyway-core tek başına yeterli değil,
# migration'ları açılışta çalıştıran otokonfigürasyon bu modülde.
spring-boot-flyway = { module = "org.springframework.boot:spring-boot-flyway" }
flyway-core = { module = "org.flywaydb:flyway-core" }
flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }

junit = { module = "junit:junit", version.ref = "junit" }
truth = { module = "com.google.truth:truth", version.ref = "truth" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-junit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint-plugin" }
